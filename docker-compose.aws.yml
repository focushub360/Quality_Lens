version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.aws
    image: citnow-backend:latest
    container_name: citnow_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      # Redis Cache Configuration
      - REDIS_URL=redis://redis:6379/0
      # Database connection (MongoDB Atlas URI)
      - MONGODB_URI=mongodb+srv://focushub360db_db_user:QualityLens2026!@cluster0.v9v5op1.mongodb.net/citnow_analyzer?retryWrites=true&w=majority
      - MONGODB_DB_NAME=citnow_analyzer
      # AWS S3 Configuration
      - USE_S3_STORAGE=true
      - AWS_STORAGE_BUCKET_NAME=your-citnow-reports-bucket
      - AWS_S3_REGION_NAME=us-east-1
      # JWT and security config
      - JWT_SECRET_KEY=69379b844f20d396b23565cbf7d3c002cfe593dec5642d3b9808dcd36830222b
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=1440
      # Super Admin Configuration
      - SUPER_ADMIN_USERNAME=admin
      - SUPER_ADMIN_PASSWORD=admin123
      - SUPER_ADMIN_EMAIL=admin@gmail.com
      - FRONTEND_URLS=https://qualitylens.focusengineeringapp.com,https://api.focusengineeringapp.com,http://localhost:3000,https://main.d26c7jks4sa4os.amplifyapp.com,https://qualitylens.focusengineering.in
      # ML settings
      - WHISPER_MODEL=base
      # CPU Resource Optimization (Upgraded 8-core CPU instance)
      - MAX_WORKERS=6
      - CONCURRENCY_LIMIT=6
      - PROCESS_TIMEOUT_SECONDS=960
      - VIDEO_HARD_DEADLINE_SECONDS=900
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: citnow_redis
    restart: always

  caddy:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        - REACT_APP_API_URL=https://api.focusengineeringapp.com
    container_name: caddy_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - redis

volumes:
  caddy_data:
  caddy_config:

