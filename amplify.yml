version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm --prefix frontend install --legacy-peer-deps
    build:
      commands:
        - CI=false REACT_APP_API_URL=https://qualitylensfocustech.duckdns.org npm --prefix frontend run build
  artifacts:
    baseDirectory: frontend/build
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
