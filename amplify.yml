version: 1
frontend:
  phases:
    preBuild:
      commands:
        - if [ -d "frontend" ]; then cd frontend; fi
        - npm install --legacy-peer-deps
    build:
      commands:
        - if [ -d "frontend" ]; then cd frontend; fi
        - CI=false REACT_APP_API_URL=https://qualitylensfocustech.duckdns.org npm run build
  artifacts:
    baseDirectory: frontend/build
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
